name: Admin - Reset Password (Telegram)

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Email address of the account to reset"
        required: true
        type: string

jobs:
  reset-password:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --no-save

      - name: Install Vercel CLI
        run: bun install -g vercel

      - name: Pull environment variables from Vercel
        run: vercel env pull .env.local --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: team_bhY6xQNSaDzgiVpXhdFPXvZL
          VERCEL_PROJECT_ID: prj_bAckE5PGlllJHSE2kGL74Bq3MjPV

      - name: Generate reset token and insert into DB
        id: gen_token
        run: |
          set -a
          source .env.local
          set +a

          cat > reset-token.mjs << 'SCRIPT'
          import { neon } from "@neondatabase/serverless";
          import { randomBytes } from "crypto";

          const sql = neon(process.env.DATABASE_URL);
          const email = process.env.RESET_EMAIL;

          // Verify the account exists
          const users = await sql`SELECT id, email FROM "user" WHERE email = ${email} LIMIT 1`;
          if (users.length === 0) {
            console.error(`No account found for email: ${email}`);
            process.exit(1);
          }

          // Generate a secure token
          const token = randomBytes(32).toString("hex");
          const id = randomBytes(16).toString("hex");
          const expiresAt = new Date(Date.now() + 60 * 60 * 1000); // 1 hour

          // Clear any existing reset tokens for this email, then insert fresh one
          await sql`DELETE FROM "verification" WHERE "identifier" = ${email}`;
          await sql`
            INSERT INTO "verification" ("id", "identifier", "value", "expiresAt", "createdAt", "updatedAt")
            VALUES (${id}, ${email}, ${token}, ${expiresAt}, NOW(), NOW())
          `;

          const resetUrl = `https://vellymon.game/reset-password?token=${token}`;
          console.log(`RESET_URL=${resetUrl}`);
          SCRIPT

          OUTPUT=$(RESET_EMAIL="${{ inputs.email }}" bun run reset-token.mjs)
          echo "$OUTPUT"
          RESET_URL=$(echo "$OUTPUT" | grep "^RESET_URL=" | cut -d= -f2-)
          echo "reset_url=$RESET_URL" >> $GITHUB_OUTPUT

      - name: Send reset link via Telegram
        run: |
          RESET_URL="${{ steps.gen_token.outputs.reset_url }}"
          EMAIL="${{ inputs.email }}"
          BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT_ID="7560699398"

          MESSAGE="🔑 *Password Reset Link*

Account: \`${EMAIL}\`
Expires: 1 hour from now

[Click here to reset your password](${RESET_URL})

Or copy this link:
\`${RESET_URL}\`"

          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{
              \"chat_id\": \"${CHAT_ID}\",
              \"text\": $(echo "$MESSAGE" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))'),
              \"parse_mode\": \"Markdown\"
            }"
