name: Admin - Reset Password

on:
  workflow_dispatch:
    inputs:
      email:
        description: "User email address"
        required: true
        type: string
      new_password:
        description: "New password (min 8 characters)"
        required: true
        type: string

jobs:
  reset-password:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --no-save

      - name: Install Vercel CLI
        run: bun install -g vercel

      - name: Pull environment variables from Vercel
        run: vercel env pull .env.local --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: <redacted type="High-Entropy Base64 Token" />
          VERCEL_PROJECT_ID: prj_bAckE5PGlllJHSE2kGL74Bq3MjPV

      - name: Reset password
        run: |
          set -a
          source .env.local
          set +a
          bun scripts/reset-password.mjs '${{ inputs.email }}' '${{ inputs.new_password }}'
