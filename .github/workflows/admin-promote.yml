name: Admin - Promote User

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Email of the user to promote to admin"
        required: true
        type: string

jobs:
  promote-user:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --no-save

      - name: Install Vercel CLI
        run: bun install -g vercel

      - name: Pull environment variables from Vercel
        run: vercel env pull .env.local --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: team_bhY6xQNSaDzgiVpXhdFPXvZL
          VERCEL_PROJECT_ID: prj_bAckE5PGlllJHSE2kGL74Bq3MjPV

      - name: Promote user to admin
        run: |
          set -a
          source .env.local
          set +a
          cat > promote.mjs << 'SCRIPT'
          import { neon } from "@neondatabase/serverless";
          const sql = neon(process.env.DATABASE_URL);
          const email = process.env.TARGET_EMAIL;

          // Check user exists
          const users = await sql`SELECT id, name, email, role FROM "user" WHERE email = ${email}`;
          if (users.length === 0) {
            console.error(`❌ No user found with email: ${email}`);
            process.exit(1);
          }

          const user = users[0];
          if (user.role === "admin") {
            console.log(`✅ ${user.name} (${user.email}) is already an admin`);
            process.exit(0);
          }

          // Promote
          await sql`UPDATE "user" SET role = 'admin' WHERE email = ${email}`;
          console.log(`✅ Promoted ${user.name} (${user.email}) from "${user.role}" → "admin"`);
          SCRIPT
          TARGET_EMAIL="${{ inputs.email }}" bun run promote.mjs
