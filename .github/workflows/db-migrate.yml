name: DB - Add Missing Columns
on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: oven-sh/setup-bun@v2
      - name: Install deps
        run: bun add @neondatabase/serverless
      - name: Add missing columns
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cat > migrate.mjs << 'EOF'
          import { neon } from "@neondatabase/serverless";
          const sql = neon(process.env.DATABASE_URL);

          // Check existing account columns
          const cols = await sql`
            SELECT column_name FROM information_schema.columns
            WHERE table_name = 'account'
          `;
          const existing = new Set(cols.map(c => c.column_name));
          console.log("Existing account columns:", [...existing].sort().join(", "));

          // Add missing columns (added in newer better-auth versions)
          const missing = [
            { name: "accessTokenExpiresAt", sql: 'ALTER TABLE "account" ADD COLUMN "accessTokenExpiresAt" TIMESTAMP' },
            { name: "refreshTokenExpiresAt", sql: 'ALTER TABLE "account" ADD COLUMN "refreshTokenExpiresAt" TIMESTAMP' },
            { name: "idToken", sql: 'ALTER TABLE "account" ADD COLUMN "idToken" TEXT' },
            { name: "scope", sql: 'ALTER TABLE "account" ADD COLUMN "scope" TEXT' },
          ];

          for (const col of missing) {
            if (!existing.has(col.name)) {
              console.log(`Adding missing column: ${col.name}`);
              await sql(col.sql);
              console.log(`  ✅ Added ${col.name}`);
            } else {
              console.log(`Column ${col.name} already exists — skipping`);
            }
          }

          // Verify final state
          const finalCols = await sql`
            SELECT column_name, data_type FROM information_schema.columns
            WHERE table_name = 'account' ORDER BY ordinal_position
          `;
          console.log("\nFinal account columns:");
          finalCols.forEach(c => console.log(`  ${c.column_name} (${c.data_type})`));
          console.log("\n✅ Migration complete");
          EOF
          bun run migrate.mjs
