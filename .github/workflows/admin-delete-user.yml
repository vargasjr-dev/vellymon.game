name: Admin - Delete User

on:
  workflow_dispatch:
    inputs:
      email:
        description: "User email address to delete"
        required: true
        type: string
      confirm:
        description: "Type CONFIRM to proceed (safety check)"
        required: true
        type: string

jobs:
  delete-user:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --no-save

      - name: Install Vercel CLI
        run: bun install -g vercel

      - name: Pull environment variables from Vercel
        run: vercel env pull .env.local --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: team_36iZPJkU2LLMsHZqJZXMZppe
          VERCEL_PROJECT_ID: prj_bAckE5PGlllJHSE2kGL74Bq3MjPV

      - name: Delete user
        run: |
          set -a
          source .env.local
          set +a
          bun scripts/delete-user.mjs '${{ inputs.email }}' '${{ inputs.confirm }}'
