name: Database Schema Sync

on:
  push:
    branches:
      - main
    paths:
      - 'data/schema.ts'
      - '.github/workflows/db-sync.yml'
  workflow_dispatch:

jobs:
  sync-schema:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --no-save

      - name: Install Vercel CLI
        run: bun install -g vercel
        
      - name: Link to Vercel project
        run: |
          vercel link --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: team_bhY6xQNSaDzgiVpXhdFPXvZL
          VERCEL_PROJECT_ID: prj_bAckE5PGlllJHSE2kGL74Bq3MjPV
        
      - name: Pull environment variables from Vercel
        run: vercel env pull .env.local --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: team_bhY6xQNSaDzgiVpXhdFPXvZL
          VERCEL_PROJECT_ID: prj_bAckE5PGlllJHSE2kGL74Bq3MjPV
        
      - name: Load environment and push schema to database
        run: |
          set -a
          source .env.local
          set +a
          bun run scripts/db-push.ts
