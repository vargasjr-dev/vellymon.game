name: Admin - List Recent Users

on:
  workflow_dispatch:

jobs:
  list-users:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --no-save

      - name: Install Vercel CLI
        run: bun install -g vercel

      - name: Pull environment variables from Vercel
        run: vercel env pull .env.local --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: team_36iZPJkU2LLMsHZqJZXMZppe
          VERCEL_PROJECT_ID: prj_bAckE5PGlllJHSE2kGL74Bq3MjPV

      - name: Query last 10 registered users
        run: |
          set -a
          source .env.local
          set +a
          node -e "
            const { neon } = require('@neondatabase/serverless');
            const sql = neon(process.env.DATABASE_URL);

            async function main() {
              try {
                // Check if user table exists
                const tables = await sql\`
                  SELECT table_name FROM information_schema.tables
                  WHERE table_schema = 'public'
                  ORDER BY table_name
                \`;
                console.log('=== TABLES IN DATABASE ===');
                if (tables.length === 0) {
                  console.log('(no tables found - migrations need to be applied)');
                } else {
                  tables.forEach(t => console.log('  -', t.table_name));
                }
                console.log('');

                // Try to query users
                const hasUserTable = tables.some(t => t.table_name === 'user');
                if (!hasUserTable) {
                  console.log('=== USER TABLE NOT FOUND ===');
                  console.log('The user table does not exist yet.');
                  console.log('Run the Database Schema Sync workflow to apply migrations.');
                  return;
                }

                // List actual column names for diagnosis
                const columns = await sql\`
                  SELECT column_name, data_type
                  FROM information_schema.columns
                  WHERE table_name = 'user' AND table_schema = 'public'
                  ORDER BY ordinal_position
                \`;
                console.log('=== USER TABLE COLUMNS ===');
                columns.forEach(c => console.log(\`  - \${c.column_name} (\${c.data_type})\`));
                console.log('');

                const users = await sql\`
                  SELECT * FROM \"user\"
                  ORDER BY 1 DESC
                  LIMIT 10
                \`;
                console.log('=== LAST 10 REGISTERED USERS ===');
                if (users.length === 0) {
                  console.log('(no users registered yet)');
                } else {
                  console.log(\`Total: \${users.length} user(s)\`);
                  console.log('');
                  users.forEach((u, i) => {
                    console.log(\`\${i + 1}. \${u.name || '(no name)'}\`);
                    console.log(\`   Email: \${u.email}\`);
                    console.log(\`   Verified: \${u.emailVerified ?? u.email_verified ?? '?'}\`);
                    console.log(\`   Registered: \${u.createdAt || u.created_at || '?'}\`);
                    console.log(\`   ID: \${u.id}\`);
                    console.log(\`   Raw: \${JSON.stringify(u)}\`);
                    console.log('');
                  });
                }
              } catch (err) {
                console.error('=== ERROR ===');
                console.error(err.message);
                process.exit(1);
              }
            }
            main();
          "
