name: Admin - List Users & DB Schema

on:
  workflow_dispatch:

jobs:
  list-users:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --no-save

      - name: Install Vercel CLI
        run: bun install -g vercel

      - name: Pull environment variables from Vercel
        run: vercel env pull .env.local --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: team_dMi4vVfMQcpXl5uFPLAApy8v
          VERCEL_PROJECT_ID: prj_bAckE5PGlllJHSE2kGL74Bq3MjPV

      - name: Show DB schema and recent users
        run: |
          set -a
          source .env.local
          set +a
          cat > query.mjs << 'SCRIPT'
          import { neon } from "@neondatabase/serverless";
          const sql = neon(process.env.DATABASE_URL);

          // 1. List all public tables
          const tables = await sql`
            SELECT table_name FROM information_schema.tables
            WHERE table_schema = 'public' ORDER BY table_name
          `;
          console.log("=== PUBLIC TABLES ===");
          tables.forEach(t => console.log("  " + t.table_name));

          // 2. Show columns for every auth table
          for (const tbl of ["user", "session", "account", "verification"]) {
            const cols = await sql`
              SELECT column_name, data_type, is_nullable, column_default
              FROM information_schema.columns
              WHERE table_name = ${tbl} AND table_schema = 'public'
              ORDER BY ordinal_position
            `;
            console.log("\n=== " + tbl.toUpperCase() + " TABLE (" + cols.length + " columns) ===");
            if (cols.length === 0) {
              console.log("  (table not found)");
            } else {
              cols.forEach(c => {
                const nullable = c.is_nullable === "YES" ? "nullable" : "NOT NULL";
                const def = c.column_default ? ` default=${c.column_default}` : "";
                console.log("  " + c.column_name + " (" + c.data_type + ", " + nullable + def + ")");
              });
            }
          }

          // 3. List recent users
          console.log("\n=== RECENT USERS ===");
          const users = await sql`SELECT * FROM "user" ORDER BY 1 DESC LIMIT 10`;
          if (users.length === 0) {
            console.log("  (no users)");
          } else {
            users.forEach((u, i) => {
              console.log((i + 1) + ". " + JSON.stringify(u));
            });
          }

          // 4. List accounts
          console.log("\n=== ACCOUNTS ===");
          const accounts = await sql`SELECT * FROM "account" LIMIT 10`;
          if (accounts.length === 0) {
            console.log("  (no accounts)");
          } else {
            accounts.forEach((a, i) => {
              console.log((i + 1) + ". " + JSON.stringify({...a, password: a.password ? "[REDACTED]" : null}));
            });
          }
          SCRIPT
          bun run query.mjs
