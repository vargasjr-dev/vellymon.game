name: DB - Check Account Columns
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: oven-sh/setup-bun@v2
      - name: Install neon
        run: bun add @neondatabase/serverless
      - name: Check account table columns
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cat > check.mjs << 'EOF'
          import { neon } from "@neondatabase/serverless";
          const sql = neon(process.env.DATABASE_URL);
          
          const tables = await sql`
            SELECT table_name 
            FROM information_schema.tables 
            WHERE table_schema = 'public'
            ORDER BY table_name
          `;
          console.log("=== PUBLIC TABLES ===");
          tables.forEach(t => console.log("  " + t.table_name));
          
          for (const tbl of ["user", "session", "account", "verification"]) {
            const cols = await sql`
              SELECT column_name, data_type, is_nullable
              FROM information_schema.columns 
              WHERE table_name = ${tbl}
              ORDER BY ordinal_position
            `;
            console.log("\n=== " + tbl.toUpperCase() + " COLUMNS ===");
            if (cols.length === 0) console.log("  (table not found)");
            cols.forEach(c => console.log("  " + c.column_name + " (" + c.data_type + ", nullable: " + c.is_nullable + ")"));
          }
          EOF
          bun run check.mjs
